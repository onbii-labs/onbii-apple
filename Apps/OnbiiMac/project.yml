name: OnbiiMac

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"

packages:
  OnbiiApple:
    path: ../../Packages

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  OnbiiMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: OnbiiApple
        product: OnbiiArchive
      - package: OnbiiApple
        product: OnbiiCapture
      - package: OnbiiApple
        product: OnbiiTranscription
    settings:
      base:
        DEVELOPMENT_TEAM: S52C3W4ZB8
        PRODUCT_NAME: Onbii
        PRODUCT_BUNDLE_IDENTIFIER: com.yepyr.onbii
        PRODUCT_MODULE_NAME: OnbiiMac
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: OnbiiMac.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true

schemes:
  OnbiiMacApp:
    build:
      targets:
        OnbiiMac: all
    run:
      config: Debug
    archive:
      config: Release
