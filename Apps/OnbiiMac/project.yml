name: OnbiiMac

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "2700"
  deploymentTarget:
    macOS: "26.0"

packages:
  OnbiiApple:
    path: ../../Packages

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode's "recommended settings" for this Xcode version, declared here so the
    # generated project is already up to date and Xcode does not offer to change
    # it on open.
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"

targets:
  OnbiiMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: OnbiiApple
        product: OnbiiArchive
      - package: OnbiiApple
        product: OnbiiCapture
      - package: OnbiiApple
        product: OnbiiTranscription
      - target: OnbiiMacQuickLook
    settings:
      base:
        DEVELOPMENT_TEAM: S52C3W4ZB8
        PRODUCT_NAME: Onbii
        PRODUCT_BUNDLE_IDENTIFIER: com.yepyr.onbii
        PRODUCT_MODULE_NAME: OnbiiMac
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: OnbiiMac.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true

  OnbiiMacQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: QuickLook
    settings:
      base:
        DEVELOPMENT_TEAM: S52C3W4ZB8
        PRODUCT_NAME: OnbiiMacQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: com.yepyr.onbii.QuickLook
        PRODUCT_MODULE_NAME: OnbiiMacQuickLook
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: QuickLook-Info.plist
        CODE_SIGN_ENTITLEMENTS: OnbiiMacQuickLook.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: "6.0"

schemes:
  OnbiiMacApp:
    build:
      targets:
        OnbiiMac: all
    run:
      config: Debug
    archive:
      config: Release
