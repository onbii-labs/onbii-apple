name: OnbiiIOS

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "2700"
  deploymentTarget:
    iOS: "26.0"

packages:
  OnbiiApple:
    path: ../../Packages

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode's "recommended settings" for this Xcode version, declared here so the
    # generated project is already up to date and Xcode does not offer to change
    # it on open.
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"

targets:
  # Named for what a person installs. PRODUCT_MODULE_NAME stays OnbiiIOS so
  # no Swift module name changes.
  Onbii:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: OnbiiApple
        product: OnbiiArchive
      - package: OnbiiApple
        product: OnbiiCapture
      - package: OnbiiApple
        product: OnbiiTranscription
      - package: OnbiiApple
        product: OnbiiProcessing
      - package: OnbiiApple
        product: OnbiiUI
      - target: OnbiiWatch
    settings:
      base:
        DEVELOPMENT_TEAM: S52C3W4ZB8
        PRODUCT_NAME: Onbii
        PRODUCT_BUNDLE_IDENTIFIER: com.yepyr.onbii
        PRODUCT_MODULE_NAME: OnbiiIOS
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 3
        # iPhone only. Left at the default of iPhone *and* iPad, the build warns
        # that an iPad app must support all four orientations — and the honest
        # answer is not to add the fourth but to stop claiming iPad, which this
        # layout was never designed or tested for. Reversible: widen this and
        # add UISupportedInterfaceOrientations~ipad when there is an iPad design.
        TARGETED_DEVICE_FAMILY: "1"
        # The app icon and the global accent colour must come from a catalog
        # compiled into this target; they cannot be served from the OnbiiUI
        # package's resource bundle. See Packages/OnbiiUI/Sources/Resources.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: OnbiiIOS.entitlements
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Development
          PROVISIONING_PROFILE_SPECIFIER: Onbii development
        Release:
          CODE_SIGN_STYLE: Automatic

  OnbiiWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../OnbiiWatch/Sources
      - path: ../OnbiiWatch/Resources
    dependencies:
      - package: OnbiiApple
        product: OnbiiCapture
    settings:
      base:
        DEVELOPMENT_TEAM: S52C3W4ZB8
        PRODUCT_NAME: OnbiiWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.yepyr.onbii.watchkitapp
        PRODUCT_MODULE_NAME: OnbiiWatch
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 3
        # The Watch takes no OnbiiUI dependency: an accent colour set is enough
        # to brand `Color.accentColor` in WatchContentView, with no Swift change.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # An authored Info.plist rather than INFOPLIST_KEY_* settings, because
        # the runtime claim a Watch recording needs — WKBackgroundModes — is an
        # array. See Apps/OnbiiWatch/Info.plist, which explains what goes in it
        # and why nothing is declared yet.
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ../OnbiiWatch/Info.plist
        CODE_SIGN_STYLE: Automatic

schemes:
  OnbiiIOSApp:
    build:
      targets:
        Onbii: all
    run:
      config: Debug
    archive:
      config: Release

  OnbiiWatchApp:
    build:
      targets:
        OnbiiWatch: all
    run:
      config: Debug
    archive:
      config: Release
